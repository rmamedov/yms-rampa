# Статика Angular-застосунку: SPA-фолбек і кешування.

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
gzip_min_length 1024;

# Хешовані ассети можна кешувати надовго.
location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Service worker і маніфест не кешуємо — інакше PWA водія застрягає на старій версії.
location = /ngsw.json      { add_header Cache-Control "no-cache"; try_files $uri =404; }
location = /sw.js          { add_header Cache-Control "no-cache"; try_files $uri =404; }
location = /ngsw-worker.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}
