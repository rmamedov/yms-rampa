# Спільна частина передачі запиту фронт-контролеру мікросервісу.
# Підключається і захищеною локацією /api/, і відкритими маршрутами входу.
#
# Сервіс визначає map $yms_service у nginx-yms.conf за префіксом URL.

fastcgi_pass yms_fpm;
include fastcgi_params;

fastcgi_param SCRIPT_FILENAME /var/www/yms/services/$yms_service/public/index.php;
fastcgi_param SCRIPT_NAME     /index.php;
fastcgi_param DOCUMENT_ROOT   /var/www/yms/services/$yms_service/public;
fastcgi_param APP_ENV         prod;
fastcgi_param APP_DEBUG       0;
fastcgi_param HTTPS           $https if_not_empty;

fastcgi_buffers 16 16k;
fastcgi_buffer_size 32k;
fastcgi_read_timeout 30s;
