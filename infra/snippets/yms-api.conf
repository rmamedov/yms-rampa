# API-шлюз: автентифікація і маршрутизація до мікросервісів.
#
# Мікросервіси самі JWT не перевіряють — вони довіряють шлюзу і читають
# ідентичність зі службових заголовків. Тому тут два обовʼязкові кроки:
#
# 1) auth_request до identity-сервісу свого контуру, який перевіряє токен
#    і повертає ідентичність у заголовках відповіді;
# 2) ПРИМУСОВЕ виставлення всіх пʼяти заголовків ідентичності через
#    fastcgi_param. Це і є захист від підробки: явний fastcgi_param
#    перекриває однойменний заголовок клієнта (перевірено на цьому сервері).
#    Саме тому вони виставляються ЗАВЖДИ і всі пʼять — включно з порожніми
#    значеннями. Забути хоч один означає дозволити його підробити.

# --- Відкриті маршрути: вхід, оновлення токена, вихід ---
# Перевіряти токен на ендпоінті входу не можна — його ще немає.
# Заголовки ідентичності тут примусово порожні.
location ~ ^/api/(admin|store|supplier|driver)/v1/auth/ {
    include /etc/nginx/snippets/yms-fastcgi-base.conf;

    fastcgi_param HTTP_X_USER_ID     "";
    fastcgi_param HTTP_X_USER_ROLE   "";
    fastcgi_param HTTP_X_SUPPLIER_ID "";
    fastcgi_param HTTP_X_STORE_IDS   "";
    fastcgi_param HTTP_X_CONTOUR     "";
}

# --- Захищені маршрути ---
location /api/ {
    # Невідомий префікс — 404 у форматі RFC 7807, а не сира сторінка nginx.
    if ($yms_service = "") {
        add_header Content-Type application/problem+json always;
        return 404 '{"type":"about:blank","title":"Not Found","status":404,"detail":"Невідомий маршрут API","code":"ROUTE_NOT_FOUND"}';
    }

    auth_request /_yms_auth;

    auth_request_set $yms_user_id     $upstream_http_x_user_id;
    auth_request_set $yms_user_role   $upstream_http_x_user_role;
    auth_request_set $yms_supplier_id $upstream_http_x_supplier_id;
    auth_request_set $yms_store_ids   $upstream_http_x_store_ids;
    auth_request_set $yms_contour     $upstream_http_x_contour;

    add_header X-YMS-Service $yms_service always;

    include /etc/nginx/snippets/yms-fastcgi-base.conf;

    fastcgi_param HTTP_X_USER_ID     $yms_user_id;
    fastcgi_param HTTP_X_USER_ROLE   $yms_user_role;
    fastcgi_param HTTP_X_SUPPLIER_ID $yms_supplier_id;
    fastcgi_param HTTP_X_STORE_IDS   $yms_store_ids;
    fastcgi_param HTTP_X_CONTOUR     $yms_contour;
}

# --- Внутрішня перевірка токена ---
# Контур обирається за префіксом URL початкового запиту: адмінка і магазин —
# це співробітники, кабінет постачальника і водій — партнери.
location = /_yms_auth {
    internal;

    fastcgi_pass yms_fpm;
    include fastcgi_params;

    fastcgi_param SCRIPT_FILENAME /var/www/yms/services/$yms_auth_service/public/index.php;
    fastcgi_param SCRIPT_NAME     /index.php;
    fastcgi_param DOCUMENT_ROOT   /var/www/yms/services/$yms_auth_service/public;
    fastcgi_param REQUEST_URI     /internal/v1/auth/verify;
    fastcgi_param DOCUMENT_URI    /internal/v1/auth/verify;
    fastcgi_param REQUEST_METHOD  GET;
    fastcgi_param QUERY_STRING    "";
    fastcgi_param CONTENT_LENGTH  "";
    fastcgi_param CONTENT_TYPE    "";
    fastcgi_param APP_ENV         prod;
    fastcgi_param APP_DEBUG       0;
}

# Відповідь identity-сервісу 401 віддаємо клієнту як 401 у форматі RFC 7807,
# а не як типову сторінку nginx.
error_page 401 = @yms_unauthorized;

location @yms_unauthorized {
    internal;
    default_type application/problem+json;
    return 401 '{"type":"about:blank","title":"Помилка автентифікації","status":401,"detail":"Токен недійсний або протермінований.","code":"AUTH_TOKEN_INVALID"}';
}
