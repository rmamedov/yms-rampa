# Маршрутизація API до мікросервісів через PHP-FPM.
# Потрібний сервіс визначає map $yms_service у nginx-yms.conf за префіксом URL.
#
# Статики під /api/ немає, тому try_files не потрібен: усе віддається
# фронт-контролеру Symfony напряму. Це і надійніше — root зі змінною
# в поєднанні з try_files поводиться непередбачувано.

location /api/ {
    # Невідомий префікс — 404 у форматі RFC 7807, а не сира сторінка nginx.
    if ($yms_service = "") {
        add_header Content-Type application/problem+json always;
        return 404 '{"type":"about:blank","title":"Not Found","status":404,"detail":"Невідомий маршрут API","code":"ROUTE_NOT_FOUND"}';
    }

    # Службовий заголовок: видно, який мікросервіс обробив запит.
    add_header X-YMS-Service $yms_service always;

    fastcgi_pass yms_fpm;
    include fastcgi_params;

    fastcgi_param SCRIPT_FILENAME /var/www/yms/services/$yms_service/public/index.php;
    fastcgi_param SCRIPT_NAME     /index.php;
    fastcgi_param DOCUMENT_ROOT   /var/www/yms/services/$yms_service/public;
    fastcgi_param APP_ENV         prod;
    fastcgi_param APP_DEBUG       0;
    fastcgi_param HTTPS           $https if_not_empty;

    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_read_timeout 30s;
}
