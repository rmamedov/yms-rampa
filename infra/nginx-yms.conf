# YMS «Рампа» — nginx.
#
# Живе поруч із наявним сайтом (Сільпо PWA на 104.248.132.130.sslip.io):
# власні піддомени, жодного default_server, конфіг сусіда не чіпається.
#
# Піддомени:
#   yms.<ip>.sslip.io     — кабінет постачальника + шлюз /api
#   driver.<ip>.sslip.io  — застосунок водія (окремий URL за вимогою SRS)
#   store.<ip>.sslip.io   — модуль магазину
#   admin.<ip>.sslip.io   — адмін-панель
#
# Роль api-gateway тут виконує nginx: маршрутизація за префіксом URL до
# фронт-контролера потрібного мікросервісу через PHP-FPM.

upstream yms_fpm { server unix:/run/php/php8.3-fpm.sock; }

map $uri $yms_service {
    default                                 "";

    # --- контур постачальника ---
    ~^/api/supplier/v1/auth                 identity-partner-service;
    ~^/api/supplier/v1/(cities|stores)      store-service;
    ~^/api/supplier/v1/(slots|bookings|route-sheets)  booking-service;
    ~^/api/supplier/v1/(vehicles|drivers)   partner-service;

    # --- контур водія ---
    ~^/api/driver/v1/auth                   identity-partner-service;
    ~^/api/driver/v1/                       booking-service;

    # --- контур магазину ---
    ~^/api/store/v1/auth                    identity-staff-service;
    ~^/api/store/v1/                        booking-service;

    # --- контур адміністратора ---
    ~^/api/admin/v1/auth                    identity-staff-service;
    ~^/api/admin/v1/(users|roles)           identity-staff-service;
    ~^/api/admin/v1/(stores|branches|sync|store-configs)  store-service;
    ~^/api/admin/v1/suppliers               partner-service;
    ~^/api/admin/v1/analytics               analytics-service;
    ~^/api/admin/v1/notifications           notification-service;
    ~^/api/admin/v1/                        store-service;
}

# --- HTTP :80 — тільки ACME і редирект на HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name yms.104.248.132.130.sslip.io driver.104.248.132.130.sslip.io
                store.104.248.132.130.sslip.io admin.104.248.132.130.sslip.io;

    location /.well-known/acme-challenge/ { root /var/www/yms/acme; }
    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS ---
server {
    listen 443 ssl http2;
    server_name yms.104.248.132.130.sslip.io;
    root /var/www/yms/web/supplier-web;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/yms/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yms/privkey.pem;
    include /etc/nginx/snippets/yms-ssl.conf;

    include /etc/nginx/snippets/yms-api.conf;
    include /etc/nginx/snippets/yms-spa.conf;
}

server {
    listen 443 ssl http2;
    server_name driver.104.248.132.130.sslip.io;
    root /var/www/yms/web/driver-web;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/yms/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yms/privkey.pem;
    include /etc/nginx/snippets/yms-ssl.conf;

    include /etc/nginx/snippets/yms-api.conf;
    include /etc/nginx/snippets/yms-spa.conf;
}

server {
    listen 443 ssl http2;
    server_name store.104.248.132.130.sslip.io;
    root /var/www/yms/web/store-web;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/yms/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yms/privkey.pem;
    include /etc/nginx/snippets/yms-ssl.conf;

    include /etc/nginx/snippets/yms-api.conf;
    include /etc/nginx/snippets/yms-spa.conf;
}

server {
    listen 443 ssl http2;
    server_name admin.104.248.132.130.sslip.io;
    root /var/www/yms/web/admin-web;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/yms/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yms/privkey.pem;
    include /etc/nginx/snippets/yms-ssl.conf;

    include /etc/nginx/snippets/yms-api.conf;
    include /etc/nginx/snippets/yms-spa.conf;
}
