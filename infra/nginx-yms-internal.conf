# Внутрішній шлюз YMS для викликів між мікросервісами.
#
# Слухає ЛИШЕ 127.0.0.1 — ззовні недосяжний. Публічні server-блоки маршрути
# /internal/ не обслуговують (додатково закриті явним deny), тому службові
# ендпоінти не можна викликати з інтернету.
#
# Навіщо окремий порт, а не прямий виклик PHP-FPM: booking-service ходить до
# сусідів звичайним HTTP-клієнтом, тому йому потрібен HTTP-адресат. Локальний
# nginx дає його, залишаючи маршрутизацію в одному місці.

map $request_uri $yms_internal_service {
    default                          "";
    ~^/internal/v1/stores            store-service;
    ~^/internal/v1/suppliers         partner-service;
    ~^/internal/v1/drivers           partner-service;
    ~^/internal/v1/partner-accounts  identity-partner-service;
    ~^/internal/v1/bookings          booking-service;
    ~^/internal/v1/notifications     notification-service;
    ~^/internal/v1/analytics         analytics-service;
}

server {
    listen 127.0.0.1:8081;
    server_name _;

    # Тіла службових запитів невеликі; великі відсікаємо одразу.
    client_max_body_size 1m;

    location /internal/ {
        if ($yms_internal_service = "") {
            add_header Content-Type application/problem+json always;
            return 404 '{"type":"about:blank","title":"Not Found","status":404,"detail":"Невідомий службовий маршрут","code":"ROUTE_NOT_FOUND"}';
        }

        fastcgi_pass yms_fpm;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/yms/services/$yms_internal_service/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/yms/services/$yms_internal_service/public;
        fastcgi_param APP_ENV         prod;
        fastcgi_param APP_DEBUG       0;

        fastcgi_read_timeout 15s;
    }

    location / {
        return 404;
    }
}
