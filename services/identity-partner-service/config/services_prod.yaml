# Порядок імпорту в MicroKernelTrait::configureContainer такий:
#
#   config/packages/*.yaml → config/packages/prod/*.yaml → config/services.yaml
#   → config/services_prod.yaml
#
# Тобто config/services.yaml завантажується ПІСЛЯ config/packages/prod/ і його
# аліаси на InMemory-реалізації перетирали б прод-звʼязування. Тому прод-профіль
# сховища (єдине джерело правди — config/packages/prod/storage.yaml) імпортуємо
# ще раз, останнім: тепер на Mongo вказують саме прод-аліаси.
#
# Файл діє лише при APP_ENV=prod, тож dev і тести лишаються на InMemory.
imports:
    - { resource: packages/prod/storage.yaml }
