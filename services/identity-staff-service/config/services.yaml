# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
#
# identity-staff-service — автентифікація співробітників мережі (контур staff).
#
# Сервіси описані ЯВНО, а не глобальним resource-глобом: у src/Domain/ живуть
# доменні обʼєкти (enum, value object, агрегати), які сервісами не є.
#
# ВАЖЛИВО: реалізації MongoDB (src/Infrastructure/Mongo) і Redis
# (src/Infrastructure/Redis) НЕ реєструються в контейнері за замовчуванням —
# розширення ext-mongodb/ext-redis можуть бути відсутні. Прод-конфігурація
# підключає їх окремим файлом; локально і в тестах працюють InMemory-реалізації.

parameters:
    # Політика паролів staff-контуру (AUTH-13: мінімум 12 символів)
    app.password.min_length: 12
    # Довжина згенерованого одноразового пароля (розділ 4.7) — з запасом до мінімуму
    app.password.generated_length: 16
    # AUTH-60: argon2id, не нижче memory 64 MB / time 3 / parallelism 4
    app.password.argon2.memory_cost: 65536
    app.password.argon2.time_cost: 3
    app.password.argon2.threads: 4

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # --- Час -------------------------------------------------------------
    App\Infrastructure\Clock\SystemClock: ~
    App\Domain\Shared\Clock: '@App\Infrastructure\Clock\SystemClock'

    # --- Паролі (AUTH-60, AUTH-13) --------------------------------------
    App\Infrastructure\Security\Argon2idPasswordHasher:
        arguments:
            $memoryCost: '%app.password.argon2.memory_cost%'
            $timeCost: '%app.password.argon2.time_cost%'
            $threads: '%app.password.argon2.threads%'
    App\Domain\Password\PasswordHasher: '@App\Infrastructure\Security\Argon2idPasswordHasher'

    App\Infrastructure\Security\ArrayPasswordDenylist: ~
    App\Domain\Password\PasswordDenylist: '@App\Infrastructure\Security\ArrayPasswordDenylist'

    App\Domain\Password\PasswordPolicy:
        arguments:
            $minLength: '%app.password.min_length%'

    # 4.7: одноразовий пароль для акаунтів, які заводить адміністратор.
    # Складність не дублюється — генератор звіряється з PasswordPolicy.
    App\Infrastructure\Security\SecurePasswordGenerator:
        arguments:
            $length: '%app.password.generated_length%'
    App\Domain\Password\PasswordGenerator: '@App\Infrastructure\Security\SecurePasswordGenerator'

    # --- JWT (AUTH-02: ОКРЕМИЙ ключ staff-контуру) -----------------------
    # HS256 для локальної розробки; у проді — FirebaseJwtSigner::rs256 з парою
    # ключів staff-контуру із секретів Kubernetes (AUTH-05, AUTH-64).
    App\Infrastructure\Security\FirebaseJwtSigner:
        factory: ['App\Infrastructure\Security\FirebaseJwtSigner', 'hs256']
        arguments:
            $secret: '%env(JWT_STAFF_SECRET)%'
            $keyId: '%env(JWT_STAFF_KEY_ID)%'
            $clock: '@App\Domain\Shared\Clock'
    App\Domain\Auth\TokenSigner: '@App\Infrastructure\Security\FirebaseJwtSigner'

    # --- Сховища ----------------------------------------------------------
    # Звʼязування доменних інтерфейсів зі сховищами винесені в:
    #   config/packages/storage.yaml       — типове (InMemory, усі оточення);
    #   config/packages/prod/storage.yaml  — прод (MongoDB + Redis).
    # Саме такий порядок імпорту (packages → packages/{env} → services.yaml)
    # дозволяє прод-файлу перекрити типові аліаси.

    # --- Доменні сервіси --------------------------------------------------
    App\Domain\Identity\AccessDecider: ~
    App\Domain\Auth\TotpVerifier: ~
    App\Domain\Auth\LoginThrottler: ~
    App\Domain\Auth\TokenService: ~
    App\Domain\Auth\AuthenticationService: ~
    App\Domain\UserManagement\StaffUserService: ~

    # --- HTTP -------------------------------------------------------------
    App\Http\ProblemDetailsFactory: ~
    App\Http\ProblemExceptionListener: ~
    App\Http\ActorResolver: ~

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # --- Консольні команди ------------------------------------------------
    App\Command\:
        resource: '../src/Command/'
