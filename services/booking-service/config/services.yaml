# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

parameters:
    # Підключення до інфраструктури тут не оголошуються: env-змінні читають
    # прод-профілі, там же лежать їхні дефолти.
    #   MONGODB_URI / MONGODB_DATABASE / REDIS_URL  — config/packages/prod/storage.yaml
    #   STORE_SERVICE_BASE_URL / PARTNER_SERVICE_BASE_URL — config/packages/prod/upstream.yaml

services:
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Класи src/ реєструються як сервіси. Реалізації на MongoDB і Redis
    # виключені зі сканування: PHP-розширення mongodb/redis можуть бути
    # відсутні на машині розробника, а контейнер має компілюватися завжди.
    App\:
        resource: '../src/'
        exclude:
            - '../src/Domain/'
            - '../src/Kernel.php'
            - '../src/Infrastructure/Mongo/'
            - '../src/Infrastructure/Redis/'

    # Доменні сервіси без залежностей від фреймворку.
    App\Domain\Slot\SlotGridGenerator: ~

    # --- Порти домену → адаптери -------------------------------------------
    #
    # Порти сховищ (OutboxStore, BookingRepository, RouteSheetRepository,
    # SlotHoldStore) звʼязані НЕ тут, а в:
    #   config/packages/storage.yaml       — типово, InMemory (dev/test);
    #   config/packages/prod/storage.yaml  — прод, MongoDB + Redis.
    # Оголошувати їх у цьому файлі не можна: ядро імпортує
    # config/packages/{env}/*.yaml ПЕРЕД config/services.yaml, тож тутешній
    # аліас мовчки перезаписав би прод-звʼязування.
    #
    # Час і генерація id однакові в усіх оточеннях.
    App\Domain\Shared\Clock: '@App\Infrastructure\Clock\SystemClock'
    App\Domain\Shared\IdGenerator: '@App\Infrastructure\Shared\RandomIdGenerator'

    # --- Міжсервісні залежності: заглушки для dev і тестів -------------------
    #
    # Аліаси нижче — ТИПОВІ, тобто для оточень без піднятих сусідів. У проді
    # ті самі порти вказують на HTTP-клієнти до store-service і partner-service
    # (config/packages/prod/upstream.yaml), який через порядок завантаження
    # конфігів імпортується ще раз останнім — з config/services_prod.yaml.
    # Тримати прод-звʼязування в цьому файлі не можна: він читається ПІСЛЯ
    # config/packages/prod/ і затирає його.
    App\Domain\Slot\SlotOverlayProvider: '@App\Infrastructure\InMemory\InMemorySlotOverlayProvider'
    App\Domain\Supplier\SupplierDirectory: '@App\Infrastructure\InMemory\InMemorySupplierDirectory'
    App\Domain\Driver\DriverDirectory: '@App\Infrastructure\InMemory\InMemoryDriverDirectory'
    # Одна заглушка на два порти: перелік філій у ній — це рівно ті філії,
    # конфігурацію яких у неї зареєстрували (див. FixtureStoreConfigProvider).
    App\Domain\Store\StoreConfigProvider: '@App\Infrastructure\Store\FixtureStoreConfigProvider'
    App\Domain\Store\StoreDirectory: '@App\Infrastructure\Store\FixtureStoreConfigProvider'

    # --- Релей outbox (DATA-16, KPI-05) --------------------------------------
    #
    # Приймач подій звʼязаний в УСІХ оточеннях, а не лише в проді: команда
    # yms:outbox:relay реєструється завжди, тож без цього аліаса контейнер не
    # зібрався б навіть у dev. Базовий URL у прод-профілі приходить із
    # ANALYTICS_SERVICE_BASE_URL (config/packages/prod/upstream.yaml), а тут
    # лишається дефолт із конструктора — внутрішній шлюз 127.0.0.1:8081.
    App\Application\Outbox\AnalyticsEventSink: '@App\Infrastructure\Analytics\HttpAnalyticsEventSink'
